name: Crypto paper monitor — 7 days (NO TRADING)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/crypto-paper-seven-days.yml'
  schedule:
    # UTC, four read-only observations each day. GitHub schedule is best-effort.
    - cron: '17 0,6,12,18 10-17 10 *'

permissions:
  contents: write # publish sanitized public dashboard observations; never crypto transactions
  actions: read

concurrency:
  group: crypto-paper-seven-days-readonly
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the seven-day UTC window
        id: window
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os
          now = datetime.now(timezone.utc)
          beginning = datetime.fromisoformat('2026-10-10T09:00:00+00:00')
          ending = datetime.fromisoformat('2026-10-17T09:00:00+00:00')
          active = beginning <= now < ending
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('active=' + str(active).lower(), file=f)
          print(f'UTC now={now.isoformat()}, start={beginning}, end={ending}; active={active}')
          PY

      - name: Checkout read-only source
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Safety and calculation tests
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest discover -s crypto_paper_agent -p 'test_*.py' -v

      - name: Verify published UI script is syntactically valid and has no transaction APIs
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          node --check docs/dashboard.js
          python3 - <<'PY'
          from pathlib import Path
          src=Path('docs/dashboard.js').read_text()
          for method in ('eth_sendTransaction','eth_sendRawTransaction','personal_sign','eth_sign','wallet_sendCalls','wallet_requestPermissions'):
              assert method not in src, f'Unsafe wallet API in browser source: {method}'
          assert 'eth_requestAccounts' in src
          print('View-only wallet API check passed')
          PY

      - name: Read public Polygon and BNB pool data (no trades)
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          mkdir -p reports
          for chain in polygon bsc; do
            set +e
            python3 crypto_paper_agent/paper_agent.py --network "$chain" --once \
              --virtual-budget-inr 10000 --virtual-flash-usd 1000 --usd-inr 90 \
              --csv "reports/${chain}_new.csv" \
              > "reports/${chain}_log.txt" 2>&1
            rc=$?
            set -e
            printf 'exit_code=%s\n' "$rc" > "reports/${chain}_status.txt"
            cat "reports/${chain}_log.txt"
          done

      - name: Restore earlier read-only report artifact if available
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p previous
          for runid in $(gh api "repos/${GH_REPO}/actions/workflows/crypto-paper-seven-days.yml/runs?status=success&per_page=12" \
              --jq '.workflow_runs[].id' 2>/dev/null); do
            if [ "$runid" = "${GITHUB_RUN_ID}" ]; then continue; fi
            if gh run download "$runid" --repo "$GH_REPO" --name crypto-paper-cumulative --dir previous >/dev/null 2>&1; then
              echo "Recovered past observations from successful run $runid"
              break
            fi
          done
          if [ ! -f previous/observations.csv ]; then echo "Starting a new cumulative report (no previous artifact found)"; fi

      - name: Create conservative cumulative report
        if: steps.window.outputs.active == 'true'
        run: python3 crypto_paper_agent/cloud_report.py --previous previous --current reports --output reports


      - name: Prepare safe browser dashboard snapshot
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,json
          from pathlib import Path
          from datetime import datetime, timezone
          src=Path('reports/observations.csv')
          summ=json.loads(Path('reports/summary.json').read_text())
          if summ.get('mode')!='READ_ONLY_NOT_EXECUTED' or summ.get('real_trades_executed')!=0 or summ.get('realized_pnl_inr')!='NOT_MEASURED':
              raise ValueError('Refusing to publish anything resembling real executions')
          observations=[]
          if src.exists():
              with src.open(newline='', encoding='utf-8') as fp:
                  for row in csv.DictReader(fp):
                      if (row.get('network') in ('polygon','bsc') and row.get('source')=='PUBLIC_RPC_READ_ONLY_SAME_BLOCK_RESERVES' and row.get('actual_transaction')=='NONE' and row.get('realized_profit_inr')=='NOT_MEASURED' and row.get('verdict') in ('SKIP_NOT_PROFITABLE_ENOUGH','SKIP_NO_LIQUIDITY','HYPOTHETICAL_CANDIDATE_NOT_EXECUTED')):
                          observations.append(row)
          if len(observations)>2500:
              observations=observations[-2500:]
          public_summary={
              'mode':'READ_ONLY_NOT_EXECUTED','real_trades_executed':0,'realized_pnl_inr':'NOT_MEASURED',
              'latest_observation_utc':summ.get('latest_observation_utc'),
              'report_generated_utc':datetime.now(timezone.utc).isoformat(),
              'total_hypothetical_route_quotes':len(observations),
              'hypothetical_candidates_not_executed':sum(r.get('verdict')=='HYPOTHETICAL_CANDIDATE_NOT_EXECUTED' for r in observations),
              'warning':'All results are historical snapshot estimates only; assumed USD/INR 90, gas 400000 units, Aave premium 9 bps and virtual flash loan USD 1000. No executions or profits.'
          }
          out={'schema_version':1,'mode':'READ_ONLY_NOT_EXECUTED','summary':public_summary,'observations':observations}
          Path('reports/dashboard-data.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Read-only quotes prepared:',len(observations))
          PY

      - name: Publish sanitized snapshot for responsive control dashboard
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target="repos/${GH_REPO}/contents/docs/dashboard-data.json"
          old_sha=$(gh api "$target" --jq '.sha')
          python3 - "$old_sha" <<'PYJSON'
          import json,base64,sys
          from pathlib import Path
          payload={'message':'data: update read-only Polygon/BNB dashboard',
                   'branch':'main',
                   'content':base64.b64encode(Path('reports/dashboard-data.json').read_bytes()).decode(),
                   'sha':sys.argv[1]}
          Path('reports/dashboard-publish-request.json').write_text(json.dumps(payload))
          PYJSON
          gh api --method PUT "$target" --input reports/dashboard-publish-request.json --silent

      - name: Upload downloadable observations + seven-day cumulative report
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crypto-paper-cumulative
          path: reports/
          if-no-files-found: error
          retention-days: 21
          compression-level: 6