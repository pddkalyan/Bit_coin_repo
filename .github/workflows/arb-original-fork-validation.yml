name: Original ArbitrageExecutor mainnet fork validation — NO FUNDS
on:
  workflow_dispatch:
  push:
    branches: [fork-validation-20261010]
    paths: ['fork_validation/**', '.github/workflows/arb-original-fork-validation.yml']
permissions:
  contents: read
jobs:
  original-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Confirm source and proofs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum fork_validation/test/ArbitrageExecutorOriginal.t.sol
          test "$(grep -c 'function test_PROOF' fork_validation/test/ArbitrageExecutorOriginal.t.sol)" -eq 3
          test "$(grep -c 'function test_T' fork_validation/test/ArbitrageExecutorOriginal.t.sol)" -eq 4
      - name: Choose recent fork block using only test fixture (production Solidity unchanged)
        env:
          MAINNET_RPC: https://ethereum-rpc.publicnode.com
        shell: bash
        run: |
          set -euo pipefail
          newest="$(cast block-number --rpc-url "$MAINNET_RPC")"
          sample="$((newest - 25))"
          echo "Pinned historical block 25733035 is pruned by public RPC; test-only fork updated to $sample"
          python3 - "$sample" <<'PY'
          import sys
          from pathlib import Path
          p=Path('fork_validation/test/ArbitrageExecutorOriginal.t.sol')
          data=p.read_text()
          old='uint256 internal constant FORK_BLOCK    = 25733035;'
          assert data.count(old)==1, 'original fixture constant mismatch'
          p.write_text(data.replace(old,'uint256 internal constant FORK_BLOCK    = '+sys.argv[1]+';'))
          # Only the test block changes. Production contract ends before TEST INFRASTRUCTURE.
          PY
      - name: Compile original production Solidity plus recent-fork test fixture
        run: forge build --root fork_validation -vv
      - name: Run seven original tests (record failures without blocking supplemental suite)
        id: original
        continue-on-error: true
        env:
          MAINNET_RPC: https://ethereum-rpc.publicnode.com
        run: forge test --root fork_validation --match-contract '^ArbitrageExecutorProof
      - name: Test scope reminder
        if: always()
        run: |
          echo "NO transactions on the actual Ethereum blockchain."
          echo "Three positive proof tests manufacture a price dislocation in the fork."
          echo "A passing fork test DOES NOT establish real net-after-gas profit."
 -vvv --gas-report
      - name: Run five independent fork safety checks
        id: independent
        continue-on-error: true
        env:
          MAINNET_RPC: https://ethereum-rpc.publicnode.com
        run: forge test --root fork_validation --match-contract '^ArbitrageExecutorIndependentForkTest
      - name: Test scope reminder
        if: always()
        run: |
          echo "NO transactions on the actual Ethereum blockchain."
          echo "Three positive proof tests manufacture a price dislocation in the fork."
          echo "A passing fork test DOES NOT establish real net-after-gas profit."
 -vvv --gas-report
      - name: Fail overall if either test suite failed
        if: always()
        shell: bash
        run: |
          echo "Original suite: ${{ steps.original.outcome }}"
          echo "Independent suite: ${{ steps.independent.outcome }}"
          test "${{ steps.original.outcome }}" = "success" && test "${{ steps.independent.outcome }}" = "success"
      - name: Test scope reminder
        if: always()
        run: |
          echo "NO transactions on the actual Ethereum blockchain."
          echo "Three positive proof tests manufacture a price dislocation in the fork."
          echo "A passing fork test DOES NOT establish real net-after-gas profit."
